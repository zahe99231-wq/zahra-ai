
name: Build ZAHRA APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip ZAHRA project
        run: unzip -q ZAHRA-AI-Android-v0.1-source.zip -d app_src

      - name: Build debug APK
        working-directory: app_src/zahra-ai-android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZAHRA-debug-apk
          path: app_src/zahra-ai-android/app/build/outputs/apk/debug/app-debug.apk
          
