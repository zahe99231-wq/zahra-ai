
name: Build ZAHRA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract ZAHRA source
        run: |
          unzip -q ZAHRA-AI-Android-v0.1-source.zip -d app_src
          
      - name: Fix Android and Kotlin versions
        run: |
          sed -i 's/8.13.0/8.13.2/g' app_src/zahra-ai-android/build.gradle.kts
          sed -i 's/2.2.20/2.3.0/g' app_src/zahra-ai-android/build.gradle.kts
          cat app_src/zahra-ai-android/build.gradle.kts

      - name: Build ZAHRA debug APK
        working-directory: app_src/zahra-ai-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload ZAHRA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAHRA-debug-apk
          path: app_src/zahra-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
