
name: Build ZAHRA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract source ZIP
        run: |
          set -e
          COUNT=$(find . -maxdepth 1 -type f -name "ZAHRA*.zip" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: ZAHRA*.zip ki exact 1 file honi chahiye, mili: $COUNT"
            ls -lah
            exit 1
          fi
          ZIP=$(find . -maxdepth 1 -type f -name "ZAHRA*.zip")
          echo "Using ZIP: $ZIP"
          mkdir -p app_src
          unzip -q "$ZIP" -d app_src
          test -f app_src/zahra-ai-android/build.gradle.kts
          test -f app_src/zahra-ai-android/app/build.gradle.kts

      - name: Fix Android and Kotlin versions
        working-directory: app_src/zahra-ai-android
        run: |
          sed -i 's/8.13.0/8.13.2/g' build.gradle.kts
          sed -i 's/2.2.20/2.4.21/g' build.gradle.kts
          sed -i '/kotlinOptions {/,/}/d' app/build.gradle.kts
          printf '\nkotlin {\n    jvmToolchain(17)\n}\n' >> app/build.gradle.kts

          echo "----- ROOT BUILD FILE -----"
          cat build.gradle.kts
          echo "----- APP BUILD FILE -----"
          cat app/build.gradle.kts

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle project
        working-directory: app_src/zahra-ai-android
        run: |
          gradle --version
          gradle tasks --no-daemon

      - name: Build ZAHRA APK
        working-directory: app_src/zahra-ai-android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="app_src/zahra-ai-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload ZAHRA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAHRA-debug-apk
          path: app_src/zahra-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
